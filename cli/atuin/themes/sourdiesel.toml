[theme]
name   = "sourdiesel" # Theme identifier
parent = "default"    # Inherit unspecified colors from Atuin's default theme

[colors]
AlertInfo       = "#ffc7c7" # Informational alerts
AlertWarn       = "#47e7b1" # Warnings and matches in the selected row
AlertError      = "#ceffc9" # Errors and the selected command row
Annotation      = "#fdf7cd" # Less-critical supporting text
Base            = "#5c617d" # Default foreground color
Guidance        = "#c4effa" # Instructions, help, and context
Important       = "#d2fd9d" # Emphasized information
Title           = "#cccccc" # Section and view titles
SyntaxCommand   = "#ceffc9" # Shell commands
SyntaxFlag      = "#f3b175" # Command-line flags
SyntaxString    = "#f4f3f2" # Quoted strings
SyntaxVariable  = "#ffc7c7" # Shell variables
SyntaxOperator  = "#cccccc" # Shell operators
SyntaxComment   = "#5c617d" # Shell comments
